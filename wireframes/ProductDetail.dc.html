<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;background:#fff;color:#111827;-webkit-font-smoothing:antialiased;}
  .screen{width:390px;min-height:880px;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .hero{height:300px;flex:none;position:relative;background:linear-gradient(135deg,#EDF3FF,#DCE7FF);display:flex;align-items:center;justify-content:center;color:#AFC6ED;}
  .hero>svg{width:52px;height:52px;stroke:currentColor;stroke-width:1.3;fill:none;}
  .hero .back{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;}
  .hero .back svg{width:22px;height:22px;stroke:#26313F;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .hero .pager{position:absolute;right:14px;bottom:14px;background:rgba(17,24,39,.6);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .scroll{flex:1;overflow:hidden;}
  .seller{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid #F1F2F3;}
  .seller .av{width:44px;height:44px;border-radius:999px;background:#7C6BD6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;}
  .seller .info{flex:1;}
  .seller .nm{font-size:14px;font-weight:700;}
  .seller .lo{font-size:12px;color:#9AA0A6;margin-top:1px;}
  .temp{text-align:right;}
  .temp .v{font-size:15px;font-weight:800;color:#F59E0B;}
  .temp .g{width:62px;height:5px;border-radius:999px;background:#EEF0F1;margin-top:4px;overflow:hidden;}
  .temp .g i{display:block;width:62%;height:100%;background:linear-gradient(90deg,#22C55E,#F59E0B);}
  .content{padding:16px;display:flex;flex-direction:column;gap:11px;}
  .cat{font-size:12px;color:#9AA0A6;}
  .ttl{font-size:19px;font-weight:700;line-height:1.4;letter-spacing:-.3px;}
  .desc{font-size:14.5px;line-height:1.75;color:#37414B;}
  .tags{display:flex;gap:7px;flex-wrap:wrap;}
  .tag{display:flex;align-items:center;gap:4px;font-size:12px;color:#0B7C7B;background:#EDF7F6;border-radius:999px;padding:6px 11px;font-weight:600;}
  .tag svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;}
  .statline{font-size:12px;color:#AEB4BB;padding-top:10px;border-top:1px solid #F1F2F3;}
  .more{padding:16px;border-top:8px solid #F5F6F7;}
  .more h4{font-size:14px;font-weight:700;margin-bottom:12px;}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .grid .g{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#B9C0C7;}
  .grid .g svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;}
  .cta{border-top:1px solid #EEF0F1;display:flex;align-items:center;gap:14px;padding:10px 16px 16px;flex:none;background:#fff;}
  .cta .heart{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#9AA0A6;flex:none;border-right:1px solid #EEF0F1;padding-right:10px;}
  .cta .heart svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.9;fill:none;}
  .cta .price{flex:1;font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .cta .btn{height:46px;padding:0 26px;border-radius:12px;background:#0EA5A4;color:#fff;display:flex;align-items:center;font-size:15px;font-weight:700;}
</style>
</helmet>
<div class="screen">
  <div class="hero">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 19 5-5 4 3 3-3 4 4"/></svg>
    <div class="back"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></div>
    <div class="pager">1 / 4</div>
  </div>
  <div class="scroll">
    <div class="seller">
      <div class="av">서</div>
      <div class="info"><div class="nm">공대냉장고요정</div><div class="lo">공대 5호관 · 24학번</div></div>
      <div class="temp"><div class="v">42.3℃</div><div class="g"><i></i></div></div>
    </div>
    <div class="content">
      <div class="cat">생활가전 · 3분 전</div>
      <div class="ttl">자취 미니 냉장고 (1년 사용, 상태 좋음)</div>
      <div class="desc">기숙사 나가면서 팝니다. 딱 1년 사용했고 소음 거의 없어요. 내부 청소 다 해뒀습니다. 직거래는 공대 5호관 앞에서 가능하고, 시간 맞으면 같이 옮기는 것도 도와드릴게요.</div>
      <div class="tags">
        <span class="tag"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>공대 5호관</span>
        <span class="tag">직거래</span>
      </div>
      <div class="statline">조회 128 · 채팅 2 · 찜 3</div>
    </div>
    <div class="more">
      <h4>공대냉장고요정님의 판매 물품</h4>
      <div class="grid">
        <div class="g" style="background:linear-gradient(135deg,#FFF3E4,#FFE7C7)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 19 5-5 4 3 3-3 4 4"/></svg></div>
        <div class="g" style="background:linear-gradient(135deg,#EAF7EE,#D8F0DF)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 19 5-5 4 3 3-3 4 4"/></svg></div>
        <div class="g" style="background:linear-gradient(135deg,#F1EEFF,#E2DCFF)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 19 5-5 4 3 3-3 4 4"/></svg></div>
      </div>
    </div>
  </div>
  <div class="cta">
    <div class="heart"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.3-8.5C1 8 3 4.5 6.5 4.5c2 0 3.5 1.2 5.5 3 2-1.8 3.5-3 5.5-3C21 4.5 23 8 21.3 11.5 19 15.6 12 20 12 20Z"/></svg></div>
    <div class="price">60,000원</div>
    <div class="btn">채팅하기</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
