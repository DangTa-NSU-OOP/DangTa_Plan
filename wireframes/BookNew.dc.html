<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;background:#fff;color:#111827;-webkit-font-smoothing:antialiased;}
  .screen{width:390px;min-height:880px;background:#fff;display:flex;flex-direction:column;overflow:hidden;}
  .appbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;border-bottom:1px solid #EEF0F1;flex:none;}
  .appbar .iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#26313F;}
  .appbar .iconbtn svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .appbar .t{font-size:16px;font-weight:700;}
  .scroll{flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:22px;}
  .isbn{height:46px;border:1.5px solid #0EA5A4;border-radius:12px;display:flex;align-items:center;padding:0 14px;gap:9px;font-size:13.5px;color:#0B7C7B;font-weight:600;background:#F5FCFC;}
  .isbn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;}
  .found{display:flex;gap:13px;padding:13px;border:1px solid #E9EBED;border-radius:14px;background:#FBFCFC;}
  .found .cover{width:58px;height:82px;border-radius:6px;background:linear-gradient(160deg,#3B6FB8,#2C5490);flex:none;box-shadow:0 1px 4px rgba(17,24,39,.14);display:flex;align-items:flex-end;padding:6px;color:rgba(255,255,255,.9);font-size:9px;font-weight:700;line-height:1.15;}
  .found .fm{flex:1;display:flex;flex-direction:column;gap:3px;}
  .found .ft{font-size:14px;font-weight:800;}
  .found .fs{font-size:12px;color:#9AA0A6;}
  .found .fl{font-size:12px;color:#6B7280;margin-top:5px;line-height:1.5;}
  .field{display:flex;flex-direction:column;gap:10px;}
  .lb{font-size:13px;font-weight:700;color:#37414B;}
  .seg{display:flex;gap:8px;}
  .seg .o{flex:1;height:42px;border:1.5px solid #E3E6E8;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#6B7280;}
  .seg .o.on{border-color:#0EA5A4;background:#F0FAF9;color:#0B7C7B;}
  .line{border-bottom:1.5px solid #EEF0F1;padding-bottom:11px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;}
  .line .off{font-size:13px;font-weight:800;color:#EF4444;}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;}
  .tg{font-size:12px;font-weight:600;color:#0B7C7B;background:#EDF7F6;border-radius:8px;padding:6px 11px;display:flex;align-items:center;gap:4px;}
  .tg.add{background:#F1F2F3;color:#8A9098;}
  .tg svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;fill:none;}
  .photos{display:flex;gap:9px;}
  .add{width:76px;height:76px;border-radius:12px;border:1.5px solid #E3E6E8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9AA0A6;font-size:11px;font-weight:600;flex:none;}
  .add svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.9;fill:none;}
  .btn{height:54px;border-radius:13px;background:#0EA5A4;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin:6px 16px 18px;flex:none;}
</style>
</helmet>
<div class="screen">
  <div class="appbar">
    <div class="iconbtn"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></div>
    <div class="t">중고책 팔기</div>
    <div style="width:40px;"></div>
  </div>
  <div class="scroll">
    <div class="isbn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>ISBN · 제목으로 책 검색</div>

    <div class="found">
      <div class="cover">일반<br>물리학</div>
      <div class="fm">
        <div class="ft">일반물리학 (제10판)</div>
        <div class="fs">Halliday, Resnick, Walker · 범한서적</div>
        <div class="fl">정가 38,000원 · ISBN 9791162241974</div>
      </div>
    </div>

    <div class="field">
      <div class="lb">책 상태</div>
      <div class="seg"><div class="o on">상 (깨끗)</div><div class="o">중</div><div class="o">하</div></div>
      <div class="seg"><div class="o on">필기 없음</div><div class="o">필기 있음</div></div>
    </div>

    <div class="field">
      <div class="lb">판매가</div>
      <div class="line">15,000원 <span class="off">정가 대비 -61%</span></div>
    </div>

    <div class="field">
      <div class="lb">강의 태그 <span style="color:#AEB4BB;font-weight:400;">(선택)</span></div>
      <div class="tagrow">
        <span class="tg"># 일반물리학1</span>
        <span class="tg add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>강의 추가</span>
      </div>
    </div>

    <div class="field">
      <div class="lb">사진</div>
      <div class="photos"><div class="add"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L18 8h2a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg>0 / 8</div></div>
    </div>

    <div class="field">
      <div class="lb">거래 장소</div>
      <div class="line" style="font-size:15px;font-weight:500;border-bottom:1.5px solid #EEF0F1;">공대 3호관</div>
    </div>
  </div>
  <div class="btn">등록하기</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
