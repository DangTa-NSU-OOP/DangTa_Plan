  .post .pt{font-size:14px;font-weight:600;}
  .post .ps{font-size:12px;color:#9CA3AF;margin-top:2px;}
  .notice{font-size:11px;color:#B45309;background:#FEF3E2;border-radius:5px;padding:1px 6px;margin-right:6px;}
  .cta{position:sticky;bottom:0;background:#fff;border-top:1px solid #E5E7EB;padding:12px 16px;flex:none;}
  .cta .btn{height:48px;border-radius:12px;background:#0EA5A4;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
