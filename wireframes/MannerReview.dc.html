<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#fff;color:#111827;}
  *{box-sizing:border-box;}
  a{color:#0B7C7B;} a:hover{color:#0B8C8B;}
  .screen{width:390px;min-height:900px;background:#fff;display:flex;flex-direction:column;}
  .appbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #EEF0F1;flex:none;}
  .appbar .x{width:24px;height:24px;border-radius:6px;background:#E5E7EB;}
  .appbar .t{font-size:16px;font-weight:700;}
  .body{flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:22px;}
  .who{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .who .pf{width:60px;height:60px;border-radius:999px;background:#E5E7EB;}
  .who .q{font-size:16px;font-weight:700;text-align:center;line-height:1.4;}
  .who .s{font-size:12px;color:#9CA3AF;}
  .sect{display:flex;flex-direction:column;gap:10px;}
  .sect .lab{font-size:13px;font-weight:700;color:#374151;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .o{padding:9px 12px;border:1px solid #E5E7EB;border-radius:999px;font-size:13px;color:#6B7280;}
  .o.on{border-color:#0EA5A4;background:#E6F7F6;color:#0B7C7B;font-weight:600;}
  .o.neg.on{border-color:#DC2626;background:#FEECEC;color:#DC2626;}
  .rebuy{display:flex;gap:10px;}
  .rebuy .r{flex:1;height:46px;border:1px solid #E5E7EB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6B7280;}
  .rebuy .r.on{border-color:#0EA5A4;background:#E6F7F6;color:#0B7C7B;font-weight:700;}
  .area{min-height:70px;border:1px solid #E5E7EB;border-radius:12px;padding:12px;font-size:13px;color:#9CA3AF;line-height:1.5;}
  .spacer{flex:1;}
  .btn{height:52px;border-radius:12px;background:#0EA5A4;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin:8px 16px 20px;}
</style>
</helmet>
<div class="screen">
  <div class="appbar"><div class="x"></div><div class="t">매너 평가</div></div>
  <div class="body">
    <div class="who">
      <div class="pf"></div>
      <div class="q">서연님과의 거래는<br>어떠셨나요?</div>
      <div class="s">자취 미니 냉장고 · 9월 10일 거래</div>
    </div>

    <div class="sect">
      <div class="lab">좋았던 점 (여러 개 선택 가능)</div>
      <div class="opts">
        <span class="o on">시간 약속을 잘 지켜요</span>
        <span class="o on">친절하고 매너가 좋아요</span>
        <span class="o">응답이 빨라요</span>
        <span class="o">상품 상태가 설명과 같아요</span>
        <span class="o">좋은 나눔 해주셨어요</span>
      </div>
    </div>

    <div class="sect">
      <div class="lab">아쉬웠던 점 (선택)</div>
      <div class="opts">
        <span class="o neg">약속 장소에 안 나왔어요</span>
        <span class="o neg">불친절해요</span>
        <span class="o neg">상품 상태가 달라요</span>
      </div>
    </div>

    <div class="sect">
      <div class="lab">이 분과 다시 거래하고 싶나요?</div>
      <div class="rebuy"><div class="r on">네, 좋아요</div><div class="r">아니요</div></div>
    </div>

    <div class="sect">
      <div class="lab">한 줄 후기 (선택)</div>
      <div class="area">거래 상대에게 전할 후기를 남겨주세요. 프로필에 공개됩니다.</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="btn">평가 보내기</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
