<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;background:#F5F6F7;color:#111827;-webkit-font-smoothing:antialiased;}
  .screen{width:390px;min-height:880px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .appbar{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;flex:none;border-bottom:1px solid #EEF0F1;}
  .appbar .t{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .appbar .actions{display:flex;}
  .iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#26313F;}
  .iconbtn svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .cats{display:flex;gap:7px;padding:11px 16px;background:#fff;border-bottom:1px solid #EEF0F1;overflow:hidden;}
  .chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid #E3E6E8;background:#fff;font-size:13px;font-weight:500;color:#5B6570;display:inline-flex;align-items:center;white-space:nowrap;}
  .chip--on{background:#0EA5A4;border-color:#0EA5A4;color:#fff;font-weight:700;}
  .list{flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:13px;}
  .g{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,.06);}
  .g .banner{height:104px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);}
  .g .banner svg{width:34px;height:34px;stroke:currentColor;stroke-width:1.5;fill:none;}
  .g .in{padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;}
  .g .name{font-size:15.5px;font-weight:800;letter-spacing:-.2px;}
  .g .desc{font-size:12.5px;color:#6B7280;line-height:1.55;}
  .g .foot{display:flex;gap:6px;align-items:center;margin-top:4px;}
  .badge{font-size:11px;font-weight:700;color:#0B7C7B;background:#EDF7F6;border-radius:6px;padding:3px 8px;}
  .badge.gray{color:#8A9098;background:#F1F2F3;}
  .members{font-size:11.5px;color:#B0B5BA;margin-left:auto;font-weight:500;}
  .fab{position:absolute;right:16px;bottom:82px;height:48px;padding:0 18px 0 14px;border-radius:999px;background:#0EA5A4;color:#fff;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;box-shadow:0 8px 18px rgba(14,165,164,.4);}
  .fab svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;}
  .tabbar{height:64px;background:#fff;border-top:1px solid #EEF0F1;display:flex;flex:none;padding-bottom:4px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:#B0B5BB;}
  .tab svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .tab--on{color:#0EA5A4;font-weight:700;}
</style>
</helmet>
<div class="screen">
  <div class="appbar">
    <div class="t">모임</div>
    <div class="actions">
      <div class="iconbtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
      <div class="iconbtn"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></div>
    </div>
  </div>
  <div class="cats">
    <span class="chip chip--on">전체</span>
    <span class="chip">운동</span>
    <span class="chip">스터디</span>
    <span class="chip">취미</span>
    <span class="chip">봉사</span>
    <span class="chip">공모전</span>
  </div>
  <div class="list">
    <div class="g">
      <div class="banner" style="background:linear-gradient(135deg,#0EA5A4,#0C8C8B)"><svg viewBox="0 0 24 24"><path d="M13 4 8 20M18 8l-4 4 4 4M6 8l-4 4 4 4"/></svg></div>
      <div class="in">
        <div class="name">한국대 아침 러닝크루</div>
        <div class="desc">주 3회 아침 6:30, 대운동장에서 5km 함께 뜁니다. 페이스 나눠 뛰어서 초보 환영!</div>
        <div class="foot"><span class="badge">운동</span><span class="badge gray">승인제</span><span class="members">멤버 24 / 30</span></div>
      </div>
    </div>
    <div class="g">
      <div class="banner" style="background:linear-gradient(135deg,#6366F1,#4F46E5)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
      <div class="in">
        <div class="name">코딩테스트 스터디 (주 1회)</div>
        <div class="desc">매주 토요일 오후, 백준·프로그래머스 문제 리뷰. 3학년 이상 우대.</div>
        <div class="foot"><span class="badge">스터디</span><span class="badge gray">승인제</span><span class="members">멤버 8 / 10</span></div>
      </div>
    </div>
    <div class="g">
      <div class="banner" style="background:linear-gradient(135deg,#F59E0B,#D97706)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></div>
      <div class="in">
        <div class="name">보드게임 번개 모임</div>
        <div class="desc">시험 끝나고 학생회관에서 보드게임 하실 분 모여요!</div>
        <div class="foot"><span class="badge">취미</span><span class="badge gray">누구나</span><span class="members">멤버 41</span></div>
      </div>
    </div>
  </div>
  <div class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>모임 개설</div>
  <div class="tabbar">
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>홈</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v15H7a2 2 0 0 1-2-2Z"/><path d="M19 17H7a2 2 0 0 0-2 2"/></svg>중고책</div>
    <div class="tab tab--on"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3.5 19c.7-3 3-4.6 5.5-4.6S13.8 16 14.5 19"/><path d="M15.5 14.5c2 .2 3.7 1.6 4.3 4"/></svg>모임</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M21 11.5a8 8 0 0 1-11.5 7.2L4 20l1.3-4.5A8 8 0 1 1 21 11.5Z"/></svg>커뮤니티</div>
    <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 4.6-6 8-6s6.6 2 8 6"/></svg>마이</div>
  </div>
</div>
</x-dc>

</body>
</html>
