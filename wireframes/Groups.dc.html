  .g .desc{font-size:12px;color:#6B7280;line-height:1.5;}
  .g .foot{display:flex;gap:8px;align-items:center;margin-top:2px;}
  .badge{font-size:11px;color:#0B7C7B;background:#E6F7F6;border-radius:6px;padding:2px 7px;}
  .badge.gray{color:#6B7280;background:#F3F4F6;}
  .members{font-size:11px;color:#9CA3AF;margin-left:auto;}
  .fab{position:absolute;right:16px;bottom:76px;width:52px;height:52px;border-radius:999px;background:#0EA5A4;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(14,165,164,.4);}
  .tabbar{height:60px;background:#fff;border-top:1px solid #E5E7EB;display:flex;flex:none;}
  .tabbar .tb2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;color:#9CA3AF;}
  .tabbar .tb2.on{color:#0EA5A4;font-weight:600;}
  .tabbar .tb2 .d{width:22px;height:22px;border-radius:7px;background:#E5E7EB;}
