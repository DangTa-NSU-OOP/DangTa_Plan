<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#F5F6F7;color:#111827;}
  *{box-sizing:border-box;}
  a{color:#0B7C7B;} a:hover{color:#0B8C8B;}
  .screen{width:390px;min-height:900px;display:flex;flex-direction:column;background:#F5F6F7;}
  .appbar{height:52px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #EEF0F1;flex:none;}
  .appbar .back{width:24px;height:24px;border-radius:6px;background:#E5E7EB;}
  .appbar .nm{font-size:15px;font-weight:700;flex:1;}
  .appbar .temp{font-size:12px;font-weight:700;color:#F59E0B;}
  .appbar .more{width:22px;height:22px;border-radius:6px;background:#E5E7EB;}
  .tradebar{background:#fff;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none;}
  .tradebar .tb{width:40px;height:40px;border-radius:8px;background:repeating-linear-gradient(45deg,#EDEFF1,#EDEFF1 6px,#E4E6E8 6px,#E4E6E8 12px);flex:none;}
  .tradebar .ti{flex:1;}
  .tradebar .ti .p{font-size:14px;font-weight:800;}
  .tradebar .ti .s{font-size:11px;color:#9CA3AF;}
  .tradebar .act{font-size:12px;font-weight:700;color:#0B7C7B;border:1px solid #0EA5A4;border-radius:8px;padding:6px 10px;}
  .stream{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:10px;}
  .sys{align-self:center;font-size:11px;color:#0B7C7B;background:#E6F7F6;border-radius:999px;padding:5px 12px;}
  .in{align-self:flex-start;max-width:74%;background:#fff;border:1px solid #EEF0F1;border-radius:14px;border-top-left-radius:4px;padding:9px 12px;font-size:14px;line-height:1.4;}
  .out{align-self:flex-end;max-width:74%;background:#0EA5A4;color:#fff;border-radius:14px;border-top-right-radius:4px;padding:9px 12px;font-size:14px;line-height:1.4;}
  .stamp{font-size:10px;color:#9CA3AF;align-self:flex-end;}
  .stamp.l{align-self:flex-start;}
  .apptcard{align-self:flex-start;max-width:80%;background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;}
  .apptcard .h{font-size:12px;color:#0B7C7B;font-weight:700;}
  .apptcard .l{font-size:13px;}
  .apptcard .b{margin-top:4px;height:34px;border-radius:8px;background:#E6F7F6;color:#0B7C7B;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .composer{background:#fff;border-top:1px solid #E5E7EB;display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none;}
  .composer .plus{width:26px;height:26px;border-radius:6px;background:#E5E7EB;flex:none;}
  .composer .box{flex:1;height:38px;border-radius:999px;background:#F3F4F6;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#9CA3AF;}
  .composer .send{width:34px;height:34px;border-radius:999px;background:#0EA5A4;flex:none;}
</style>
</helmet>
<div class="screen">
  <div class="appbar">
    <div class="back"></div>
    <div class="nm">공대냉장고요정</div>
    <div class="temp">42.3℃</div>
    <div class="more"></div>
  </div>
  <div class="tradebar">
    <div class="tb"></div>
    <div class="ti"><div class="p">60,000원</div><div class="s">자취 미니 냉장고 · 판매중</div></div>
    <div class="act">거래완료</div>
  </div>
  <div class="stream">
    <div class="sys">채팅방이 열렸어요. 매너있는 거래를 부탁드려요.</div>

    <div class="in">안녕하세요! 냉장고 아직 있나요?</div>
    <div class="stamp l">오후 2:31</div>

    <div class="out">네 있어요~ 오늘 직거래 가능하세요?</div>
    <div class="stamp">오후 2:33 · 읽음</div>

    <div class="in">네 저녁에 공대 5호관 쪽 괜찮아요</div>

    <div class="apptcard">
      <div class="h">📅 약속 잡기</div>
      <div class="l">9월 10일 (수) 오후 6:00</div>
      <div class="l">📍 공대 5호관 정문 앞</div>
      <div class="b">약속 수락하기</div>
    </div>
    <div class="stamp l">오후 2:35</div>

    <div class="out">좋아요! 그때 봬요 🙌</div>
    <div class="stamp">오후 2:36 · 읽음</div>
  </div>
  <div class="composer">
    <div class="plus"></div>
    <div class="box">메시지 입력</div>
    <div class="send"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
